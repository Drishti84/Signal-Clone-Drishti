# Render blueprint for the FastAPI backend.
# One instance on purpose: open WebSockets are tracked in memory, so a second
# instance would not see the first one's connections.
services:
  - type: web
    name: signal-clone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.7"
      # Comma-separated list of frontend origins, e.g. https://your-app.vercel.app
      - key: CORS_ORIGINS
        sync: false
